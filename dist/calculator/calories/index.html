</a> <div class="mb-8"> <div class="mb-4 text-5xl">🍎</div> <h1 class="mb-2 text-4xl font-bold">Calorie Target</h1> <p class="text-lg text-white/60">Daily calorie goal</p> </div> <div id="input-flow" class="mx-auto max-w-2xl px-6 py-12" data-astro-cid-gy7pbaoz> <div id="restore-banner" class="mb-8 hidden rounded-lg border border-[#0070f3]/30 bg-[#0070f3]/10 p-4" data-astro-cid-gy7pbaoz> <p class="text-sm" data-astro-cid-gy7pbaoz>Continue where you left off?</p> <div class="mt-2 flex gap-3" data-astro-cid-gy7pbaoz> <button id="restore-yes" class="text-sm font-medium text-[#0070f3]" data-astro-cid-gy7pbaoz>Yes, restore</button> <button id="restore-no" class="text-sm text-white/60" data-astro-cid-gy7pbaoz>Start fresh</button> </div> </div> <div class="mb-8" data-astro-cid-gy7pbaoz> <p class="mb-2 text-sm text-white/40" id="progress-text" data-astro-cid-gy7pbaoz>Step 1 of 6</p> <div class="h-1 w-full overflow-hidden rounded-full bg-white/10" data-astro-cid-gy7pbaoz> <div id="progress-bar" class="h-full bg-[#50e3c2] transition-all duration-300" style="width: 0%" data-astro-cid-gy7pbaoz></div> </div> </div> <div id="steps-container" class="relative overflow-hidden" style="min-height: 400px" data-astro-cid-gy7pbaoz> <!-- Steps will be injected here --> </div> <button id="calculate-btn" class="hidden w-full rounded-lg bg-white py-4 text-center font-semibold text-black transition-opacity hover:opacity-90" data-astro-cid-gy7pbaoz>
Calculate →
</button> </div> <script>(function(){const calculatorSlug = "calories";
const requiredFields = ["age","gender","height","weight","activity","goal"];

  const fieldConfigs = {
    age: {
      question: "How old are you?",
      type: "slider",
      min: 10,
      max: 90,
      default: 30,
      unit: "years"
    },
    gender: {
      question: "What's your biological sex?",
      note: "for biological measurement only",
      type: "cards",
      options: [
        { value: "male", label: "Male", icon: "👨" },
        { value: "female", label: "Female", icon: "👩" }
      ]
    },
    height: {
      question: "How tall are you?",
      type: "slider",
      min: 100,
      max: 250,
      default: 170,
      unit: "cm"
    },
    weight: {
      question: "What's your current weight?",
      type: "slider",
      min: 30,
      max: 200,
      default: 70,
      unit: "kg"
    },
    waist: {
      question: "What's your waist circumference?",
      type: "slider",
      min: 40,
      max: 200,
      default: 80,
      unit: "cm"
    },
    neck: {
      question: "What's your neck circumference?",
      type: "slider",
      min: 20,
      max: 60,
      default: 35,
      unit: "cm"
    },
    hip: {
      question: "What's your hip circumference?",
      type: "slider",
      min: 60,
      max: 180,
      default: 95,
      unit: "cm"
    },
    restHR: {
      question: "What's your resting heart rate?",
      type: "slider",
      min: 40,
      max: 100,
      default: 70,
      unit: "bpm"
    },
    exerciseMin: {
      question: "How many minutes do you exercise daily?",
      type: "slider",
      min: 0,
      max: 180,
      default: 30,
      unit: "min"
    },
    activity: {
      question: "How active are you?",
      type: "activity",
      options: [
        { value: "sedentary", icon: "🪑", label: "Sedentary", desc: "Mostly sitting, desk job" },
        { value: "light", icon: "🚶", label: "Lightly active", desc: "Walk 1–3 days/week" },
        { value: "moderate", icon: "🏃", label: "Moderately active", desc: "Exercise 3–5 days/week" },
        { value: "very", icon: "💪", label: "Very active", desc: "Hard training 6–7 days" },
        { value: "athlete", icon: "🏋️", label: "Athlete", desc: "Twice daily or physical job" }
      ]
    },
    goal: {
      question: "What's your goal?",
      type: "cards",
      options: [
        { value: "lose", label: "Lose weight", icon: "📉" },
        { value: "maintain", label: "Maintain", icon: "⚖️" },
        { value: "build", label: "Build muscle", icon: "💪" }
      ]
    }
  };

  let currentStep = 0;
  const answers = {};
  const sessionKey = `fc_input_${calculatorSlug}`;
  const unitPrefs = JSON.parse(localStorage.getItem('fc_units') || '{"weight":"kg","height":"cm"}');

  // Check for saved session
  const savedSession = sessionStorage.getItem(sessionKey);
  if (savedSession) {
    document.getElementById('restore-banner').classList.remove('hidden');
    document.getElementById('restore-yes').onclick = () => {
      Object.assign(answers, JSON.parse(savedSession));
      document.getElementById('restore-banner').classList.add('hidden');
      renderStep();
    };
    document.getElementById('restore-no').onclick = () => {
      sessionStorage.removeItem(sessionKey);
      document.getElementById('restore-banner').classList.add('hidden');
    };
  }

  function updateProgress() {
    const percent = ((currentStep + 1) / requiredFields.length) * 100;
    document.getElementById('progress-bar').style.width = `${percent}%`;
    document.getElementById('progress-text').textContent = `Step ${currentStep + 1} of ${requiredFields.length}`;
  }

  function saveToSession() {
    sessionStorage.setItem(sessionKey, JSON.stringify(answers));
  }

  function renderStep() {
    const container = document.getElementById('steps-container');
    const field = requiredFields[currentStep];
    const config = fieldConfigs[field];

    let html = `
      <div class="animate-slide-in">
        <h2 class="mb-2 text-3xl font-bold">${config.question}</h2>
        ${config.note ? `<p class="mb-6 text-sm text-white/40">${config.note}</p>` : '<div class="mb-6"></div>'}
    `;

    if (config.type === 'slider') {
      const value = answers[field] || config.default;
      html += `
        <div class="rounded-lg border border-white/10 bg-[#111] p-8">
          <div class="mb-4 flex items-center justify-between">
            <input type="number" id="input-${field}" value="${value}" 
              class="w-24 rounded border border-white/10 bg-black px-3 py-2 text-2xl font-mono font-bold" 
              min="${config.min}" max="${config.max}">
            <span class="text-white/60">${config.unit || unitPrefs[field] || ''}</span>
          </div>
          <input type="range" id="slider-${field}" value="${value}" 
            min="${config.min}" max="${config.max}" 
            class="w-full accent-[#50e3c2]">
          <div id="validation-${field}" class="mt-4 text-sm"></div>
          <button id="next-btn" class="mt-6 w-full rounded-lg bg-white/10 py-3 font-semibold transition-colors hover:bg-white/20">
            Next →
          </button>
        </div>
      `;
    } else if (config.type === 'cards') {
      html += `<div class="grid gap-4 ${config.options.length === 2 ? 'grid-cols-2' : 'grid-cols-3'}">`;
      config.options.forEach(opt => {
        const selected = answers[field] === opt.value;
        html += `
          <button data-value="${opt.value}" class="card-option rounded-lg border p-6 text-left transition-all ${
            selected ? 'border-[#0070f3] bg-[#0070f3]/10' : 'border-white/10 bg-[#111] hover:border-white/30'
          }">
            <div class="mb-2 text-3xl">${opt.icon}</div>
            <div class="font-semibold">${opt.label}</div>
          </button>
        `;
      });
      html += '</div>';
    } else if (config.type === 'activity') {
      html += '<div class="space-y-3">';
      config.options.forEach(opt => {
        const selected = answers[field] === opt.value;
        html += `
          <button data-value="${opt.value}" class="card-option flex w-full items-center gap-4 rounded-lg border p-4 text-left transition-all ${
            selected ? 'border-[#0070f3] bg-[#0070f3]/10' : 'border-white/10 bg-[#111] hover:border-white/30'
          }">
            <div class="text-3xl">${opt.icon}</div>
            <div>
              <div class="font-semibold">${opt.label}</div>
              <div class="text-sm text-white/60">${opt.desc}</div>
            </div>
            ${selected ? '<div class="ml-auto text-[#50e3c2]">✓</div>' : ''}
          </button>
        `;
      });
      html += '</div>';
    }

    html += '</div>';
    container.innerHTML = html;

    // Attach event listeners
    if (config.type === 'slider') {
      const input = document.getElementById(`input-${field}`);
      const slider = document.getElementById(`slider-${field}`);
      const validation = document.getElementById(`validation-${field}`);
      const nextBtn = document.getElementById('next-btn');

      const validate = (val, autoAdvance = false) => {
        if (val >= config.min && val <= config.max) {
          validation.innerHTML = '<span class="text-[#50e3c2]">✓ Looks good</span>';
          answers[field] = parseInt(val);
          saveToSession();
          if (autoAdvance) setTimeout(() => nextStep(), 400);
        } else {
          validation.innerHTML = `<span class="text-red-400">Please enter a value between ${config.min}–${config.max}</span>`;
        }
      };

      slider.oninput = () => {
        input.value = slider.value;
        validate(slider.value, false);
      };
      input.onchange = () => {
        slider.value = input.value;
        validate(input.value, false);
      };
      nextBtn.onclick = () => {
        if (answers[field]) nextStep();
        else validate(input.value, false);
      };
    } else if (config.type === 'cards' || config.type === 'activity') {
      document.querySelectorAll('.card-option').forEach(btn => {
        btn.onclick = () => {
          answers[field] = btn.dataset.value;
          saveToSession();
          setTimeout(() => nextStep(), 200);
        };
      });
    }

    updateProgress();
  }

  function nextStep() {
    currentStep++;
    if (currentStep >= requiredFields.length) {
      showCalculateButton();
    } else {
      renderStep();
    }
  }

  function showCalculateButton() {
    document.getElementById('steps-container').innerHTML = `
      <div class="text-center">
        <div class="mb-4 text-6xl">✓</div>
        <h2 class="mb-2 text-2xl font-bold">All set!</h2>
        <p class="text-white/60">Ready to see your results</p>
      </div>
    `;
    document.getElementById('calculate-btn').classList.remove('hidden');
    document.getElementById('progress-bar').style.width = '100%';
  }

  document.getElementById('calculate-btn').onclick = () => {
    localStorage.setItem(`fc_calc_${calculatorSlug}`, JSON.stringify(answers));
    window.location.href = `/calculator/${calculatorSlug}/result`;
  };

  renderStep();
})();</script>  </div>  </main> <footer class="border-t border-white/10 py-8"> <div class="mx-auto max-w-7xl px-6 text-center text-sm text-white/40"> <p>FitnessCalculator © 2026</p> </div> </footer> </body></html>
